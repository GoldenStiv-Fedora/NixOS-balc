name: "Автоматическое обновление пакетов NixOS"

on:
  schedule:
    - cron: '0 2 */1 * *'
  workflow_dispatch:

env:
  COMMIT_MSG: "система: автоматическое обновление flake.lock"
  GIT_USER_NAME: "github-actions[bot]"
  GIT_USER_EMAIL: "github-actions[bot]@users.noreply.github.com"

  FLAKE_DIR: "configs"
  STUB_FILES: "hardware-configuration.nix"

jobs:
  update-flake:
    name: "Обновление flake.lock"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: "Клонирование репозитория"
        uses: actions/checkout@v5

      - name: "Установка Nix"
        uses: DeterminateSystems/nix-installer-action@v13

      - name: "Подготовка среды и обновление"
        run: |
          cd "${{ env.FLAKE_DIR }}"

          for file in ${{ env.STUB_FILES }}; do
            if [ ! -f "$file" ]; then
              echo "{ ... }: { }" > "$file"
              echo "Создана заглушка: $file"
            fi
          done

          if [ -d "../apps" ]; then
            ln -s ../apps apps
            echo "Временная ссылка на ../apps создана"
          fi

          nix flake update --extra-experimental-features "nix-command flakes"

          rm -f apps
          for file in ${{ env.STUB_FILES }}; do
            rm -f "$file"
          done

      - name: "Сохранение изменений в GitHub"
        run: |
          git config user.name "${{ env.GIT_USER_NAME }}"
          git config user.email "${{ env.GIT_USER_EMAIL }}"

          git add "${{ env.FLAKE_DIR }}/flake.lock"

          if ! git diff --staged --quiet; then
            git commit -m "${{ env.COMMIT_MSG }}"
            git push
          else
            echo "Изменений нет — flake.lock актуален"
          fi
